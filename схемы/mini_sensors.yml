metadata:
  title: 'Харви «Компакт мини» — RP2350: датчики'
options:
  fontname: Arial
  bgcolor: WH
  bgcolor_node: WH
  bgcolor_connector: WH
  bgcolor_cable: WH
  color_mode: full
  mini_bom_mode: false
connectors:
  RP:
    type: RP2350-Zero
    subtype: датчики (шины приводов — лист «Шины приводов»)
    pinlabels:
    - 3V3 (выход)
    - GND
    - GP2 · XSHUT датчика края 1 (вперёд, слева)
    - GP3 · XSHUT датчика края 2 (вперёд, справа)
    - GP6 · XSHUT датчика края 3 (назад, слева)
    - GP7 · XSHUT датчика края 4 (назад, справа)
    - GP10 · XSHUT датчика края 5 (бок, слева)
    - GP11 · XSHUT датчика края 6 (бок, справа)
    - GP12 · I2C0 SDA
    - GP13 · I2C0 SCL
    - GP14 · ИК-приёмник маяка, слева
    - GP15 · ИК-приёмник маяка, справа
    - GP26 · INT1 BMI270 (рывок, падение, «подняли»)
    - GP27 · ALERT INA226 (батарея, перегрузка)
    - GP28 · резерв · АЦП
    - GP29 · резерв · АЦП
    show_pincount: false
    notes: 'Заняты все 20 выводов: касание перенесено на Pi Zero, резерв — GP28, GP29
      (АЦП)'
  SH:
    type: Плата шин — разъёмы датчиков
    subtype: I2C0 на 3,3 В, подтяжка 2,2 кОм (на модулях подтяжки снять)
    pinlabels:
    - 3,3 В
    - GND
    - SDA
    - SCL
    notes: звезда от платы шин к каждому датчику
  VL1:
    type: 'Датчик края 1: VL53L4CD'
    subtype: вперёд, слева · у дна, луч к столу
    pinlabels:
    - VIN 3,3 В
    - GND
    - SDA
    - SCL
    - XSHUT
    notes: 'адрес раздаётся при включении: по очереди поднять XSHUT и сменить адрес'
  VL2:
    type: 'Датчик края 2: VL53L4CD'
    subtype: вперёд, справа · у дна, луч к столу
    pinlabels:
    - VIN 3,3 В
    - GND
    - SDA
    - SCL
    - XSHUT
    notes: 'адрес раздаётся при включении: по очереди поднять XSHUT и сменить адрес'
  VL3:
    type: 'Датчик края 3: VL53L4CD'
    subtype: назад, слева · у дна, луч к столу
    pinlabels:
    - VIN 3,3 В
    - GND
    - SDA
    - SCL
    - XSHUT
    notes: 'адрес раздаётся при включении: по очереди поднять XSHUT и сменить адрес'
  VL4:
    type: 'Датчик края 4: VL53L4CD'
    subtype: назад, справа · у дна, луч к столу
    pinlabels:
    - VIN 3,3 В
    - GND
    - SDA
    - SCL
    - XSHUT
    notes: 'адрес раздаётся при включении: по очереди поднять XSHUT и сменить адрес'
  VL5:
    type: 'Датчик края 5: VL53L4CD'
    subtype: бок, слева · у дна, луч к столу
    pinlabels:
    - VIN 3,3 В
    - GND
    - SDA
    - SCL
    - XSHUT
    notes: 'адрес раздаётся при включении: по очереди поднять XSHUT и сменить адрес'
  VL6:
    type: 'Датчик края 6: VL53L4CD'
    subtype: бок, справа · у дна, луч к столу
    pinlabels:
    - VIN 3,3 В
    - GND
    - SDA
    - SCL
    - XSHUT
    notes: 'адрес раздаётся при включении: по очереди поднять XSHUT и сменить адрес'
  IMU:
    type: IMU BMI270
    subtype: в центре корпуса, на стойке у Pi
    pinlabels:
    - VCC 3,3 В
    - GND
    - SDA
    - SCL
    - INT1
  INA:
    type: INA226 на плате питания
    subtype: I2C — лист «Питание и логика»
    pinlabels:
    - ALERT
  IR1:
    type: 'ИК-приёмник слева: TSOP38238'
    subtype: 38 кГц · в передней стенке у камеры
    pinlabels:
    - VS 3,3 В
    - GND
    - OUT
    notes: 'найти станцию без ПК: сравнить сигнал слева и справа'
  IR2:
    type: 'ИК-приёмник справа: TSOP38238'
    subtype: 38 кГц · в передней стенке у камеры
    pinlabels:
    - VS 3,3 В
    - GND
    - OUT
    notes: 'найти станцию без ПК: сравнить сигнал слева и справа'
